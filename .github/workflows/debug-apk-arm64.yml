name: Debug APK (arm64-v8a)

# Builds a test APK for real phones from any fix/** branch, or on demand.
on:
  push:
    branches: [ 'fix/**' ]
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore native build tree
        uses: actions/cache@v4
        with:
          path: androidApp/.cxx
          key: debug-native-arm64-${{ hashFiles('native/voice/**', 'androidApp/build.gradle.kts') }}
          restore-keys: debug-native-arm64-

      # Only arm64-v8a: native voice code is compiled once instead of four times.
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon -PvoiceAbis=arm64-v8a

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls androidApp/build/outputs/apk/debug/*arm64-v8a*.apk | head -n 1)"
          test -f "$apk"
          mkdir -p dist
          short_sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cp "$apk" "dist/lampcord-debug-arm64-v8a-${short_sha}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lampcord-debug-arm64-v8a
          path: dist/*.apk
          retention-days: 14
