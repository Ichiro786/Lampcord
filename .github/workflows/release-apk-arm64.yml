name: Release APK (arm64-v8a)

# Builds an optimized (R8, non-debuggable) APK for real-world performance testing. Debug builds
# run Compose without R8 and with ART debugging on, so they stutter no matter what the code does.
# Signed with a debug key cached across runs, so each build installs over the previous one.
# Every build is versioned X.Y.Z-fork.<run number>. Run it by hand with "publish" ticked to put the
# APK on a GitHub Release of this fork: the in-app updater checks Ichiro786/Lampcord releases.
on:
  push:
    branches: [ 'fix/**' ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build as a release (the app will offer it as an update)
        type: boolean
        default: true
      notes:
        description: What's new (shown in the app's update sheet)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore native build tree
        uses: actions/cache@v4
        with:
          path: androidApp/.cxx
          key: release-native-arm64-${{ hashFiles('native/voice/**', 'androidApp/build.gradle.kts') }}
          restore-keys: release-native-arm64-

      # One stable signing key for every run, so updates install without uninstalling.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lampcord-test-signing-key-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Only arm64-v8a: native voice code is compiled once instead of four times.
      - name: Build release APK
        # AGP ignored ~/.android/debug.keystore on the runner and signed with a fresh random key
        # every run, so updates refused to install. Sign explicitly with the cached key instead.
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:lintRelease :androidApp:testReleaseUnitTest
          :shared:desktopTest --no-daemon -PvoiceAbis=arm64-v8a
          -PforkBuild=${{ github.run_number }}
          -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore
          -Pandroid.injected.signing.store.password=android
          -Pandroid.injected.signing.key.alias=androiddebugkey
          -Pandroid.injected.signing.key.password=android

      - name: Print signing certificate
        shell: bash
        run: |
          apk="$(ls androidApp/build/outputs/apk/*/*arm64-v8a*.apk | head -n 1)"
          set -euo pipefail
          apksigners=("$ANDROID_HOME"/build-tools/*/apksigner)
          "${apksigners[-1]}" verify --print-certs "$apk"

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls androidApp/build/outputs/apk/release/*arm64-v8a*.apk | head -n 1)"
          test -f "$apk"
          mkdir -p dist
          app_version="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          version="${app_version}-fork.${GITHUB_RUN_NUMBER}"
          # The updater picks the asset whose name contains "android" and reads the version from it.
          cp "$apk" "dist/lampcord-android-arm64-v8a-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lampcord-release-arm64-v8a
          path: dist/*.apk
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### What's new"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else git log -1 --pretty=format:'%s' 2>/dev/null || echo "Fork build $VERSION"; fi
            echo
            echo "## Build"
            echo "Branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA::7}\`."
          } > notes.md
          gh release create "v$VERSION" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Lampcord $VERSION" --notes-file notes.md --latest
