name: Desktop Linux

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: Upload packaged output as workflow artifacts
        required: false
        default: false
        type: boolean
      artifact-prefix:
        description: Prefix for workflow artifact names
        required: false
        default: ''
        type: string
      staging-release-tag:
        description: Draft release tag used for cross-job package handoff
        required: false
        default: ''
        type: string
      cache-read-only:
        description: Keep the Gradle cache read-only
        required: false
        default: false
        type: boolean
      package-native:
        description: >-
          Also build deb, rpm and pacman packages for distribution channels.
        required: false
        default: false
        type: boolean
      package-aur:
        description: >-
          Build an AUR source tarball from packaging/aur with pkgver and the source
          checksums rewritten for this build.
        required: false
        default: false
        type: boolean
      version:
        description: >-
          Version to name the package after. Defaults to appVersion, which is the tester
          build identity. The release workflow passes its own release version so package
          names match the release tag.
        required: false
        default: ''
        type: string
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  package:
    name: AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: desktop-linux
          cache-read-only: ${{ inputs.cache-read-only }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prepare external libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 jq libarchive-tools ${{ inputs.package-native && 'rpm' || '' }}

          mkdir -p tools
          curl --fail --location --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            --output tools/appimagetool.AppImage
          chmod +x tools/appimagetool.AppImage

      - name: Build Linux AppImage
        shell: bash
        run: ./gradlew :desktopApp:createAppImageLocal --no-daemon --no-build-cache --no-configuration-cache

      - name: Collect Linux AppImage
        id: package
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"
          source="dist/Lampcord.AppImage"
          test -f "$source" || { echo "Linux AppImage was not produced" >&2; exit 1; }
          output="dist/lampcord-desktop-linux-x64-${version}.AppImage"
          mv "$source" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Build native Linux packages
        if: inputs.package-native
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"

          ./gradlew :desktopApp:packageUberJarForCurrentOS :desktopApp:createLinuxRuntimeImage \
            --no-daemon --no-build-cache --no-configuration-cache

          jar=$(find desktopApp/build/compose/jars -maxdepth 1 -name '*.jar' -type f | head -n 1)
          [[ -n "$jar" ]] || { echo "No uber jar was produced" >&2; exit 1; }

          # The jlink image is what keeps the packages off the host JRE: the jar alone would
          # depend on java-runtime and fail on distros shipping a JRE older than the classes.
          runtime="$(pwd)/desktopApp/build/runtime-image"
          [[ -x "$runtime/bin/java" ]] || { echo "No runtime image was produced" >&2; exit 1; }

          mkdir -p dist/native
          ./scripts/package_linux.sh --version "$version" --jar "$jar" --runtime "$runtime" --out dist/native

          # Publish the bare jar as well: it is the exact byte set the AUR source tarball
          # bundles, and a handy artifact in its own right. The upload step below globs
          # dist/native/*, so leaving it here is enough.
          cp "$jar" "dist/native/lampcord-desktop-linux-x64-${version}.jar"
          ls -1 dist/native

      - name: Build AUR source tarball
        if: inputs.package-aur
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: |
          set -euo pipefail
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "appVersion" ]]; then version="$value"; break; fi
          done < gradle.properties
          [[ -n "$VERSION_OVERRIDE" ]] && version="$VERSION_OVERRIDE"

          # The AUR package consumes the uber jar, the same artifact deb and rpm are built
          # from, rather than renaming an AppImage. That drops fuse2 from the dependency
          # list and makes all four Linux packages one layout.
          jar="dist/native/lampcord-desktop-linux-x64-${version}.jar"
          if [[ ! -f "$jar" ]]; then
            jar=$(find desktopApp/build/compose/jars -maxdepth 1 -name '*.jar' -type f | head -n 1)
          fi
          test -f "$jar" || { echo "No uber jar was produced" >&2; exit 1; }

          # The AUR package used to pull a jre-openjdk dependency, which only hangs together
          # while the distro JRE is newer than our classes. Bundle the same jlink image the
          # deb and rpm carry, so the package installs and runs anywhere.
          if [[ ! -x desktopApp/build/runtime-image/bin/java ]]; then
            ./gradlew :desktopApp:createLinuxRuntimeImage \
              --no-daemon --no-build-cache --no-configuration-cache
          fi
          test -x desktopApp/build/runtime-image/bin/java || {
            echo "No runtime image was produced" >&2
            exit 1
          }

          staging="$(mktemp -d)"
          # Build the single self-contained source the PKGBUILD references: the jar plus the
          # launcher, desktop file and both icons. Deterministic (sorted entries, zeroed mtime
          # and ownership, gzip without a header stamp) so the checksum is stable and the
          # committed copy reproduces the same bytes where the jar does.
          mkdir -p "$staging/lampcord"
          cp "$jar" "$staging/lampcord/lampcord.jar"
          cp -a desktopApp/build/runtime-image "$staging/lampcord/runtime"
          cp packaging/aur/lampcord-launcher packaging/aur/lampcord.desktop \
            packaging/aur/lampcord.png packaging/aur/lampcord.svg "$staging/lampcord/"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$staging/lampcord-desktop-linux-x64-${version}.tar" -C "$staging" lampcord
          gzip -n -9 "$staging/lampcord-desktop-linux-x64-${version}.tar"
          tarball="$staging/lampcord-desktop-linux-x64-${version}.tar.gz"

          workdir="$staging/lampcord-bin"
          mkdir -p "$workdir"
          # The PKGBUILD is a single URL source, so only the PKGBUILD ships in the AUR tarball;
          # the data tarball it points at is uploaded as a separate release asset.
          cp packaging/aur/PKGBUILD "$workdir/"

          # AUR packages are named with a release version, not a tester build version, so an
          # alpha appVersion would produce a PKGBUILD that no user can ever match to a tag.
          release_version="$version"
          if [[ "$release_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-a[0-9]+$ ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi

          asset_tag="v${version}"
          if [[ -z "$VERSION_OVERRIDE" ]]; then
            # Nightly publishes the tarball on its own staged release, so pin the source there
            # rather than at a stale rolling tag that varies between runs.
            asset_tag="${STAGING_RELEASE_TAG:-nightly}"
          fi
          sed -i "s|releases/download/v\${pkgver}|releases/download/${asset_tag}|" "$workdir/PKGBUILD"

          tarball_sha="$(sha256sum "$tarball" | cut -d' ' -f1)"

          python3 - \
            "$workdir/PKGBUILD" "$release_version" "$tarball_sha" <<'PY'
          import re
          import sys

          path, pkgver, tarball_sha = sys.argv[1:4]
          with open(path, encoding="utf-8") as handle:
              text = handle.read()

          text = re.sub(r"^pkgver=.*$", f"pkgver={pkgver}", text, count=1, flags=re.M)
          text = re.sub(
              r"^sha256sums=\(.*?\)$",
              f"sha256sums=('{tarball_sha}')",
              text,
              count=1,
              flags=re.M | re.S,
          )
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

          # The checksum must have been substituted, and it has to match the tarball this is
          # published beside, otherwise makepkg fails for every AUR user.
          if grep -q 'REPLACED_BY_CI' "$workdir/PKGBUILD"; then
            echo "PKGBUILD still contains placeholder checksums" >&2
            exit 1
          fi
          grep -q "'${tarball_sha}'" "$workdir/PKGBUILD" || {
            echo "PKGBUILD tarball checksum rewrite failed" >&2
            exit 1
          }

          mkdir -p dist/aur
          tar -czf "dist/aur/lampcord-bin-${version}-aur.tar.gz" -C "$staging" "lampcord-bin"
          tar -tzf "dist/aur/lampcord-bin-${version}-aur.tar.gz" > /dev/null
          # The data tarball becomes a release asset next to the checksum, which is what makes
          # the PKGBUILD source URL resolve.
          cp "$tarball" "dist/aur/"
          ls -1 dist/aur

      - name: Upload native Linux assets
        if: inputs.package-native && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/native/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload AUR source asset
        if: inputs.package-aur && inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
        run: gh release upload "$STAGING_RELEASE_TAG" dist/aur/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload Linux artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}desktop-linux
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 4

      - name: Upload Linux staging asset
        if: inputs.staging-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE_TAG: ${{ inputs.staging-release-tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: gh release upload "$STAGING_RELEASE_TAG" "$PACKAGE_PATH" --clobber --repo "$GITHUB_REPOSITORY"
